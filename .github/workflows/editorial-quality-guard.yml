# Source-level editorial guard for the legacy gh-pages branch.
# This validates article, taxonomy, image and harness contracts. It does not replace
# GitHub Pages' legacy build and cannot stop a direct push from being deployed, so
# CLAUDE.md's pre-push gate remains mandatory.
name: Editorial quality guard

on:
  push:
    branches: [gh-pages]
    paths:
      - "_posts/**"
      - "img/editorial/**"
      - "img/source/**"
      - "journal/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "about/**"
      - "privacy/**"
      - "editorial-policy/**"
      - "naver/**"
      - "_includes/**"
      - "_layouts/**"
      - "_config.yml"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "PERSONA.md"
      - ".claude/**"
      - ".agents/**"
      - "tools/**"
      - ".github/workflows/editorial-quality-guard.yml"
  pull_request:
    paths:
      - "_posts/**"
      - "img/editorial/**"
      - "img/source/**"
      - "journal/**"
      - "index.html"
      - "css/**"
      - "js/**"
      - "about/**"
      - "privacy/**"
      - "editorial-policy/**"
      - "naver/**"
      - "_includes/**"
      - "_layouts/**"
      - "_config.yml"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "PERSONA.md"
      - ".claude/**"
      - ".agents/**"
      - "tools/**"
      - ".github/workflows/editorial-quality-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check harness tool syntax
        run: |
          node --check tools/editorial-workspace.mjs
          node --check tools/lib/source-images.mjs
          node --check tools/lib/authority-brief.mjs
          node --check tools/capture-google-trends.mjs
          node --check tools/apply-editorial-package.mjs
          node --check tools/verify-publication-scope.mjs
          node --check tools/verify-deployment.mjs
          node --check tools/test-editorial-gates.mjs
          node --check tools/test-search-ui.mjs
          node --check tools/test-ad-boundaries.mjs
          node --check tools/validate-harness.mjs
          node --check tools/verify-site-quality.mjs
          node --check tools/validate-editorial-package.mjs
      - name: Run editorial gate regression tests
        run: node tools/test-editorial-gates.mjs
      - name: Verify search states
        run: node tools/test-search-ui.mjs
      - name: Render actual advertising boundaries
        run: |
          mkdir -p "$RUNNER_TEMP/jelly-template-tests"
          cp tools/template-test-deps/package*.json "$RUNNER_TEMP/jelly-template-tests/"
          npm ci --prefix "$RUNNER_TEMP/jelly-template-tests" --ignore-scripts --no-audit --no-fund
          TEST_NODE_MODULES="$RUNNER_TEMP/jelly-template-tests/node_modules" node tools/test-ad-boundaries.mjs
      - name: Validate harness structure
        run: node tools/validate-harness.mjs
      - name: Verify current site quality
        run: node tools/verify-site-quality.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
