  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); min-height:100vh; padding:48px 20px 64px;

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;

  .card video { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#000; }
  .body { padding:18px 20px 20px; }

  .body p { color:var(--sub); font-size:.9rem; line-height:1.55; }
  .play { display:inline-block; margin-top:16px; padding:11px 26px; border-radius:99px;
    background:var(--accent); color:#2b1d02; font-weight:800; letter-spacing:.06em;
    text-decoration:none; }
  .play:hover { filter:brightness(1.08); }
  .play:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  a.home { margin-top:40px; color:var(--sub); text-decoration:none; font-size:.85rem; }
  a.home:hover { color:var(--ink); }
