    <style>
      :root {
        color-scheme: dark;
        --kr-font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR",
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #05060a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        font-family: var(--kr-font);
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #05060a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0a0c14;
        touch-action: none;
        outline: 3px solid transparent;
        outline-offset: -3px;
      }

      #unity-canvas:focus-visible {
        outline-color: #f2c14f;
      }

      /* Dark siege loading screen */
      #unity-loading-bar {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(70, 90, 140, 0.18) 0%, rgba(5, 6, 10, 0) 60%),
          linear-gradient(180deg, #0a0c16 0%, #05060a 60%, #020204 100%);
        z-index: 20;
      }

      #unity-loading-emblem {
        font-size: 52px;
        filter: drop-shadow(0 0 18px rgba(120, 160, 255, 0.35));
        animation: castle-pulse 1.8s ease-in-out infinite;
      }

      @keyframes castle-pulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      #unity-loading-text {
        font-family: var(--kr-font);
        font-size: 16px;
        letter-spacing: 0.02em;
        color: #cfd8f0;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }

      #unity-progress-bar-empty {
        width: min(320px, 70vw);
        height: 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(140, 170, 255, 0.28);
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, #3a5bc7 0%, #6f9dff 60%, #a9c4ff 100%);
        box-shadow: 0 0 10px rgba(111, 157, 255, 0.6);
        transition: width 0.15s ease-out;
      }

      #unity-warning {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        font-family: var(--kr-font);
        font-size: 13px;
        pointer-events: none;
      }

      #unity-warning > div {
        pointer-events: auto;
        margin: 6px auto;
        max-width: 90vw;
        border-radius: 6px;
        text-align: center;
      }

      #unity-footer {
        display: none;
      }
      /* Rotate-to-landscape gate. Hidden by default so a desktop browser at any window
         shape never sees it; shown only on a touch device held upright. */
      #rotate-prompt {
        display: none;
      }
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #rotate-prompt {
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.6rem;
          padding: 2rem;
          text-align: center;
          background: #05060a;
          color: #e8eef4;
          font-family: var(--kr-font);
        }
        #rotate-prompt .rotate-icon {
          font-size: 3.4rem;
          animation: rotate-hint 2.4s ease-in-out infinite;
        }
        #rotate-prompt .rotate-title {
          margin: 0;
          font-size: 1.25rem;
          font-weight: 800;
          letter-spacing: 0.04em;
        }
        #rotate-prompt .rotate-sub {
          margin: 0;
          font-size: 0.9rem;
          line-height: 1.5;
          color: #9db0c0;
        }
        /* The canvas keeps running underneath; we only cover it, so rotating resumes
           exactly where the player was instead of restarting the match. */
      }
      @keyframes rotate-hint {
        0%, 45% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate-prompt .rotate-icon { animation: none; transform: rotate(-90deg); }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1" aria-label="Castle War gameplay canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-emblem">🏰</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">불러오는 중…</div>
      </div>
      <div id="unity-warning"></div>
      <!--
        The board is a wide 39-47 world-unit battlefield with both castles on screen at
        once. In portrait that framing either crushes the play area or hides one keep, so
        rather than ship a second HUD layout we ask for the rotation. Pure CSS media query:
        no script, nothing to fail, and it disappears the moment the device turns.
      -->
      <div id="rotate-prompt" role="alertdialog" aria-live="polite">
        <div class="rotate-icon">📱</div>
        <p class="rotate-title">가로로 돌려주세요</p>
        <p class="rotate-sub">공성전은 양쪽 성이 한 화면에 보여야 합니다</p>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingText = document.querySelector("#unity-loading-text");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or a permanent
      // error message on top of the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: #7a1f1f; color: #ffe4e4; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: #7a5a1f; color: #fff3d6; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/castle-war.loader.js";
      var config = {
        dataUrl: buildUrl + "/castle-war.data.unityweb",
        frameworkUrl: buildUrl + "/castle-war.framework.js.unityweb",
        codeUrl: buildUrl + "/castle-war.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "castle-war",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // Keep keyboard input (1/2/3 unit select, etc.) flowing to the canvas after
      // boot and on every tap/click. tabindex=-1 keeps this single full-screen
      // application surface out of normal document Tab order while preserving
      // programmatic focus and the focus-visible treatment above.
      function focusCanvas() {
        if (canvas) canvas.focus();
      }
      canvas.tabIndex = -1;
      canvas.addEventListener("click", focusCanvas);
      canvas.addEventListener("pointerdown", focusCanvas);

      // Block the browser gestures that fight a full-screen touch siege game:
      // page scroll/bounce, pinch-zoom, and the long-press context menu.
      var preventDefaultTouch = function (e) { e.preventDefault(); };
      canvas.addEventListener("touchstart", preventDefaultTouch, { passive: false });
      canvas.addEventListener("touchmove", preventDefaultTouch, { passive: false });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", preventDefaultTouch);

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }

      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          // Unity's loader resets the canvas tabindex; keep it programmatically
          // focusable without adding a single application surface to Tab order.
          canvas.tabIndex = -1;
          focusCanvas();
        }).catch((message) => {
          loadingText.textContent = "불러오지 못했습니다";
          unityShowBanner(message, "error");
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
