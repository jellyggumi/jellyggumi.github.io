# Site settings
title: JellyGGumi Journal
email: "banggujin@gmail.com"
# Used as the fallback meta description and in the WebSite structured data, so it
# has to describe the site to a stranger. The previous tagline told a search user
# nothing about what they would find here.
description: "Warm, source-checked guides to Korean culture and daily life, alongside one family's first-hand records from Korea."
tagline: "Everyday Korea, warmly observed."
url: "https://jellyggumi.github.io"
timezone: Asia/Seoul
# Empty, not "/". The site is served from the domain root, and a bare "/" made
# every `| prepend: site.baseurl` produce a doubled slash — "//css/main.css" is a
# protocol-relative URL pointing at a host literally named "css". GitHub Pages
# normalises it away, which hid the bug in production while breaking local builds.
baseurl: ""
naver_username: "jelly_ggumi"
youtube_username: "jelly_ggumi"
facebook_username: ""
twitter_username: ""
instagram_username: "jelly._.ggumi"
github_username: "jellyggumi"
# `discus_shortname` (sic) used to sit here. Misspelt, referenced by nothing, and
# duplicating the real setting under `comments.disqus.short_name` below. Removed.
# deviantart_username and flickr_username were also removed: both were empty and both
# only ever guarded commented-out markup in the footer.
# This static site has no authenticated reader profile. Anonymous Facebook/X/Threads
# share icons therefore stay closed; verified owner profile links remain in the footer.
authenticated_reader_context: false
share: false

# Owner/author information
owner:
  name: jelly_ggumi
  avatar: INA.png
  favicon: favicon.ico
  info: Warm field notes on Korean culture, family life and the practical details between them

# Comments. `short_name` is empty, so disqus_comments.html renders nothing — the include
# now requires a non-empty shortname rather than falling through to the vendor's
# "yourproject.disqus.com" placeholder. To turn comments on: register a Disqus forum,
# put its shortname here, and set `comments: true` in a post's front matter.
comments:
  provider: disqus
  disqus:
    short_name: ""

# Main navigation — content sections only. About/Contact/Privacy live in the
# footer so the header stays focused on things a reader actually browses.
# Relative paths: absolute URLs here broke the active-page highlight and made
# local preview links jump to production.
nav:
  - JOURNAL: "/journal/"
  - GALLERY: "/gallery/"
  - NAVER: "/naver/"

# Secondary navigation, rendered in the footer.
footer_nav:
  - ABOUT: "/about/"
  - EDITORIAL: "/editorial-policy/"
  - CONTACT: "/contact/"
  - PRIVACY: "/privacy/"
  - RSS: "/feed.xml"

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000

google_site_verification: mfV0-xbtMeYnOR_RUx43PwdtFtWH5HlaJ7xFxITxyRA

# Google Analytics 4 measurement ID. Leave empty to take analytics off the site.
# The ID was hard-coded in head.html twice — in the loader URL and in the
# gtag('config') call — which is a pair that can drift apart in an edit and leave
# the page loading a tag that reports to nothing.
#
# Property: "jellyggumi" under the "banggujin" Analytics account
# (banggujin@gmail.com), the same identity that owns the AdSense account below.
google_analytics:
  id: "G-LZGE8E8VHZ"

# Google AdSense publisher ID. Leave empty to take AdSense off the site entirely:
# the loader, the ownership meta tag and every ad unit are all gated on this one
# value. Must stay in sync with the publisher declared in /ads.txt — CI fails the
# build if they disagree, because a mismatch is exactly the state AdSense reports
# as "ads.txt missing" while ad serving stays switched off.
#
# Account review, Auto ads and consent-message states are deliberately not copied
# into this public repository because they change independently of a deploy. Verify
# them in the AdSense dashboard before acting; the values below only describe the
# source-controlled manual placements.
google_ad_client: ca-pub-6960738425944933

# Ad unit slot IDs, created in the AdSense dashboard under Ads > By ad unit.
# Leave a slot empty to hide that placement without touching any template — an
# <ins> with an empty data-ad-slot is an unfillable request, not an ad.
google_ad_slots:
  post_bottom: "5870536631" # jellyggumi-post-bottom, display, under the body of every post
  post_in_article: "9426638261" # jellyggumi-in-article, fluid, auto-placed mid-post

# Build settings
markdown: kramdown
highlighter: rouge
# Single permalink key. A second `permalink:` used to follow this line; YAML keeps
# the last occurrence, so `pretty` was silently discarded. Declaring the real
# scheme once removes the ambiguity.
permalink: "/journal/:title/"
paginate: 6
paginate_path: "/journal/page:num/"
categories_path: "/journal/category/"
tags_path: "/journal/tag/"

# `gems:` was renamed to `plugins:` in Jekyll 3.5 and is ignored by current
# versions — locally that silently disabled pagination and emptied the journal
# index. GitHub Pages loads jekyll-paginate from its own whitelist, which is why
# production still worked and the breakage only showed up in a local build.
plugins:
  - jekyll-paginate

exclude:
  - node_modules
  - README.md
  - LICENSE
  - resize.py
  - tools
  - _workspace
  - .claude
  - .agents
  - CLAUDE.md
  - AGENTS.md
  - PERSONA.md

# The `sitemap:` block below is not read by anything.
#
# sitemap.xml in this repo is a hand-written Liquid template that reads each page's own
# `sitemap:` front matter (changefreq / priority / exclude) and decides inclusion itself.
# These keys belonged to third-party sitemap plugins that are neither installed nor
# listed in `plugins:` above. They do not configure this repository's hand-written
# sitemap.xml template.
#
# Kept only as a pointer to where sitemap behaviour actually lives, since deleting it
# outright would leave no trace of why the keys were once here.
#   -> to exclude a page:      sitemap: { exclude: true } in its front matter
#   -> to set change frequency: sitemap: { changefreq: weekly }
#   -> to set priority:         sitemap: { priority: 0.8 }
